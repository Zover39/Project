<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Задание 4 — Тёмная тема</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1f2430;
    --card-bg: #f5f5f7;
    --border: #ddd;
  }
  [data-theme="dark"] {
    --bg: #14161d;
    --text: #eef0f5;
    --card-bg: #1c1f29;
    --border: #333;
  }
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }
  h1 { font-size: 1.3rem; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-top: 16px;
  }
  button {
    padding: 10px 16px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 1rem;
  }
</style>
</head>
<body>

<h1>Задание 4 — Тёмная тема</h1>

<button id="theme-toggle">🌞 Переключить тему</button>

<div class="card">
  Текущая тема: <strong id="theme-label">светлая</strong>
</div>

<script>
  const root = document.documentElement;
  const toggleBtn = document.getElementById('theme-toggle');
  const themeLabel = document.getElementById('theme-label');
  let isDark = false;

  toggleBtn.addEventListener('click', () => {
    isDark = !isDark;
    // Переключение атрибута data-theme меняет все CSS-переменные разом
    root.setAttribute('data-theme', isDark ? 'dark' : 'light');
    themeLabel.textContent = isDark ? 'тёмная' : 'светлая';
    toggleBtn.textContent = isDark ? '🌙 Переключить тему' : '🌞 Переключить тему';
  });
</script>
</body>
</html>
