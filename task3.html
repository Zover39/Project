<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Задание 3 — Генератор таблицы</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; }
  label { margin-right: 10px; }
  input[type="number"] { width: 60px; padding: 4px; }
  button { padding: 8px 14px; margin-top: 10px; margin-right: 8px; cursor: pointer; }
  table { border-collapse: collapse; margin-top: 14px; }
  td {
    width: 34px; height: 34px;
    border: 1px solid #ccc;
    cursor: pointer;
    text-align: center;
  }
  .color-palette { display: flex; gap: 8px; margin: 10px 0; }
  .swatch {
    width: 26px; height: 26px;
    border-radius: 4px;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .swatch.selected { border-color: #000; }
  #cell-count-result { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<h1>Задание 3</h1>

<label>Строки: <input type="number" id="rows-input" value="4" min="1" max="20"></label>
<label>Столбцы: <input type="number" id="cols-input" value="5" min="1" max="20"></label>
<button id="btn-generate-table">Создать таблицу</button>

<div id="table-container"></div>

<p>Цвет для клика по ячейке:</p>
<div class="color-palette" id="color-palette"></div>

<button id="btn-count-color">Подсчитать ячейки выбранного цвета</button>
<div id="cell-count-result"></div>

<script>
  let selectedColor = 'royalblue';
  const paletteColors = ['royalblue', 'red', 'green', 'orange', 'purple', '#eeeeee'];

  function buildPalette() {
    const palette = document.getElementById('color-palette');
    palette.innerHTML = '';
    paletteColors.forEach(color => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (color === selectedColor ? ' selected' : '');
      sw.style.background = color;
      sw.addEventListener('click', () => {
        selectedColor = color;
        buildPalette();
      });
      palette.appendChild(sw);
    });
  }
  buildPalette();

  // Функция для генерации таблицы с заданными размерами
  function generateTable(rows, cols) {
    const container = document.getElementById('table-container');
    container.innerHTML = '';
    const table = document.createElement('table');

    for (let r = 0; r < rows; r++) {
      const tr = document.createElement('tr');
      for (let c = 0; c < cols; c++) {
        const td = document.createElement('td');
        td.dataset.color = ''; // текущий цвет ячейки
        // Клик по ячейке меняет цвет фона
        td.addEventListener('click', () => {
          td.style.backgroundColor = selectedColor;
          td.dataset.color = selectedColor;
        });
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    container.appendChild(table);
  }

  document.getElementById('btn-generate-table').addEventListener('click', () => {
    const rows = parseInt(document.getElementById('rows-input').value) || 1;
    const cols = parseInt(document.getElementById('cols-input').value) || 1;
    generateTable(rows, cols);
    document.getElementById('cell-count-result').textContent = '';
  });

  // таблица по умолчанию при загрузке страницы
  generateTable(4, 5);

  // Функция подсчёта количества ячеек определённого цвета
  function countCellsByColor(color) {
    const cells = document.querySelectorAll('table td');
    let count = 0;
    cells.forEach(cell => {
      if (cell.dataset.color === color) count++;
    });
    return count;
  }

  document.getElementById('btn-count-color').addEventListener('click', () => {
    const count = countCellsByColor(selectedColor);
    document.getElementById('cell-count-result').textContent =
      `Ячеек цвета "${selectedColor}": ${count}`;
  });
</script>
</body>
</html>
