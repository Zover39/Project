<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Задание 2 — Управление классами</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; }
  #classy-element {
    display: inline-block;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  #classy-element.active { background: #dcfce7; border-color: green; }
  button { padding: 8px 14px; margin-right: 8px; cursor: pointer; }
  #class-list-output { font-family: monospace; color: #555; }
</style>
</head>
<body>

<h1>Задание 2</h1>

<div id="classy-element" class="demo-box">Элемент с классами</div>
<br>
<button id="btn-toggle-active">Переключить класс "active"</button>
<button id="btn-list-classes">Показать классы</button>

<p id="class-list-output"></p>

<script>
  const el = document.getElementById('classy-element');

  // Добавить класс active, если его нет, и удалить, если есть
  document.getElementById('btn-toggle-active').addEventListener('click', () => {
    el.classList.toggle('active');
  });

  // Вывести список классов в консоль и в тег p рядом
  document.getElementById('btn-list-classes').addEventListener('click', () => {
    const classes = Array.from(el.classList);
    console.log('Классы элемента:', classes);
    document.getElementById('class-list-output').textContent =
      classes.length ? 'Классы: ' + classes.join(', ') : 'У элемента нет классов.';
  });
</script>
</body>
</html>
