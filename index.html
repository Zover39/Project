<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер задач с фильтрами и сортировкой</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Задачи с фильтрами</h1>
            <button class="btn" onclick="openAddModal()">+ Новая задача</button>
        </header>

        <!-- Панель поиска, фильтров и сортировки -->
        <div class="controls-panel">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск задачи по тексту..." oninput="applyFiltersAndSort()">
            
            <div class="filters-row">
                <div class="filter-group">
                    <button class="filter-btn active" onclick="setStatusFilter('all', this)">Все</button>
                    <button class="filter-btn" onclick="setStatusFilter('active', this)">Активные</button>
                    <button class="filter-btn" onclick="setStatusFilter('completed', this)">Выполненные</button>
                </div>
                
                <div class="filter-group">
                    <select id="sortSelect" class="sort-select" onchange="applyFiltersAndSort()">
                        <option value="default">Сортировка: По умолчанию</option>
                        <option value="title-asc">По алфавиту (А-Я)</option>
                        <option value="title-desc">По алфавиту (Я-А)</option>
                        <option value="user">По ID автора</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="loading" class="loading">Загрузка задач и пользователей...</div>
        <div id="taskList" class="task-list"></div>
    </div>

    <!-- Модалка Добавления / Редактирования -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Добавить задачу</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="taskForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskInputText">Текст задачи</label>
                    <input type="text" id="taskInputText" class="form-control" required placeholder="Что нужно сделать?">
                </div>
                <div class="form-group">
                    <label for="taskUserId">ID пользователя (1 - 10)</label>
                    <input type="number" id="taskUserId" class="form-control" min="1" max="10" value="1" required>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
