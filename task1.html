<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Задание 1 — Основные операции с DOM</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; }
  .block { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  button { padding: 8px 14px; margin-right: 8px; margin-top: 6px; cursor: pointer; }
  .new-div { background: #e0e7ff; padding: 10px; border-radius: 6px; margin-top: 10px; }
  .old-element { background: #fee2e2; padding: 10px; border-radius: 6px; }
  #clickable-paragraph { cursor: pointer; }
</style>
</head>
<body>

<h1>Задание 1</h1>

<div class="block">
  <div id="target-element">Исходный текст элемента</div>
  <button id="btn-change-text">Изменить текст на "Привет, мир!"</button>
</div>

<div class="block">
  <button id="btn-add-div">Добавить div.new-div в конец body</button>
</div>

<div class="block">
  <div class="old-element">Я элемент с классом old-element</div>
  <button id="btn-delete-old">Удалить .old-element</button>
</div>

<div class="block">
  <p id="clickable-paragraph">Это изменяемый абзац.</p>
</div>

<script>
  // 1. Найти элемент по ID и изменить его текст
  document.getElementById('btn-change-text').addEventListener('click', () => {
    document.getElementById('target-element').textContent = 'Привет, мир!';
  });

  // 2. Создать новый div с классом new-div и добавить в конец body
  document.getElementById('btn-add-div').addEventListener('click', () => {
    const newDiv = document.createElement('div');
    newDiv.className = 'new-div';
    newDiv.textContent = 'Я новый элемент';
    document.body.appendChild(newDiv);
  });

  // 3. Удалить элемент с классом old-element
  document.getElementById('btn-delete-old').addEventListener('click', () => {
    const el = document.querySelector('.old-element');
    if (el) el.remove();
  });

  // 4-5. Создать p с текстом, при клике менять цвет текста и размер шрифта
  const paragraph = document.getElementById('clickable-paragraph');
  const colors = ['red', 'green', 'blue', 'purple', 'orange'];
  let clicks = 0;
  paragraph.addEventListener('click', () => {
    clicks++;
    paragraph.style.color = colors[clicks % colors.length];
    paragraph.style.fontSize = (16 + (clicks % 5) * 4) + 'px';
  });
</script>
</body>
</html>
